# Static-site config for the "play" image.
# The nginx-unprivileged base image runs as a non-root user (uid 101) and
# listens on 8080, which keeps the container usable under rootless Podman.
server {
    # IPv4 only: some rootless Podman network setups disable IPv6, and nginx
    # refuses to start if a listen socket cannot be created.
    listen      8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json image/svg+xml;

    # Vite output is content-hashed (assets/index-BaGsqMWz.js), so it can be
    # cached forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html, the generated AudioWorklet bundle, and the unhashed game data
    # (maps, art, audio under /src/demos/...) must always be revalidated so a
    # new deploy is picked up immediately.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
